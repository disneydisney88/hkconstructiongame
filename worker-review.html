<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工人角色修復預覽</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a222c; color:#eee;
    font-family:"Cascadia Code","Consolas","Microsoft JhengHei",monospace; font-size:12px; }
  #c { position:fixed; inset:0; display:block; }
  #info { position:fixed; top:12px; left:12px; z-index:10; width:330px;
    background:rgba(8,12,16,.9); border:1px solid #3a4a58; border-radius:10px; padding:12px 14px; line-height:1.8; }
  #info h1 { font-size:13px; color:#ffd76e; margin-bottom:4px; }
  .ok { color:#7ef0a0; } .bad { color:#ff7a7a; } .val { color:#8fd0ff; }
  #btns { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:8px; }
  #btns button { cursor:pointer; font:inherit; font-size:13px; padding:10px 18px; border-radius:8px;
    border:1px solid #3a4a58; background:rgba(16,22,28,.92); color:#cfd8e0; }
  #btns button.on { background:rgba(255,176,58,.25); border-color:#ffb03a; color:#ffd98a; }
  #speed { position:fixed; bottom:14px; right:14px; z-index:10; background:rgba(8,12,16,.9);
    border:1px solid #3a4a58; border-radius:8px; padding:8px 12px; }
  #speed input { width:150px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  <h1>工人角色 · 骨架修復預覽</h1>
  <div id="st">載入中…</div>
</div>
<div id="btns"></div>
<div id="speed">速度 <input id="spd" type="range" min="0" max="3" step="0.05" value="1"> <span id="spdv">1.00</span></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x303a46);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .05, 200);
camera.position.set(.6, 1.15, 3.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .95, 0); controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xe8f0ff, 0x5a5248, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
sun.position.set(3, 6, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5; sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc0d0ff, .7); fill.position.set(-4, 3, -4); scene.add(fill);

const ground = new THREE.Mesh(new THREE.CircleGeometry(10, 48), new THREE.MeshStandardMaterial({ color: 0x5a6458, roughness: .95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(20, 20, 0x243240, 0x1c2834); grid.position.y = .002; scene.add(grid);

const st = document.getElementById("st"), btns = document.getElementById("btns");
const loader = new FBXLoader();
const FILES = [["idle", "models/mixamo/idle.fbx"], ["walk", "models/mixamo/walk.fbx"], ["run", "models/mixamo/run.fbx"]];

import {createWorker} from './worker-rig.js';
let worker, speed=0;
const source=await new Promise((res,rej)=>loader.load('models/mixamo/idle.fbx',res,undefined,rej));
worker=createWorker(source);scene.add(worker.g);
st.innerHTML='codex-rebound-v1 · 重綁骨＋網格修復<br>程序行跑動作 · 正面參考貼圖<br>近鏡及背面質感仍未達照片級';
for(const [label,value] of [['站立',0],['行路',1.5],['跑步',5]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>speed=value;btns.appendChild(b);}
for(const [label,xyz,target]of [['正面',[0,1.05,3.4],[0,.96,0]],['側面',[3.4,1.05,0],[0,.96,0]],['背面',[0,1.05,-3.4],[0,.96,0]],['近鏡',[.1,1.47,1.2],[0,1.42,0]]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{camera.position.set(...xyz);controls.target.set(...target);controls.update();};btns.appendChild(b);}
const spd=document.getElementById('spd'), spdv=document.getElementById('spdv');let timeScale=1;
spd.oninput=()=>{timeScale=+spd.value;spdv.textContent=timeScale.toFixed(2);};
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{worker.animate(Math.min(clock.getDelta(),.05)*timeScale,speed);controls.update();renderer.render(scene,camera);});
</script></body></html>
